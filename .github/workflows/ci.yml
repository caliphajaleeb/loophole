name: CI — selftest suite

# Runs the Loophole self-test suite (tests/selftest.py, 12 unittest cases
# covering rule fixtures, config handling, baselines, severity validation
# and output formats) on every push to main and on every pull request
# (issue #20). A PR that breaks the suite must fail CI instead of
# merging green.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run selftest suite
        run: python3 -m unittest tests.selftest -v
