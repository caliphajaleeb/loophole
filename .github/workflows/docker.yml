name: Docker image smoke test

# Builds the official Dockerfile and smoke-tests it against the
# fixtures (issue #29). The vulnerable fixtures must produce findings
# and exit 1; the clean fixtures must produce no findings and exit 0.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t loophole .

      - name: Verify image runs as a non-root user
        run: |
          id_output="$(docker run --rm --entrypoint id loophole)"
          echo "$id_output"
          echo "$id_output" | grep -q "uid=10001"

      - name: Verify entrypoint lists rules
        run: docker run --rm loophole scan --rules .

      - name: Smoke-test vulnerable fixture (must exit 1)
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/src" loophole scan /src/tests/fixtures/py_vuln.py
          test $? -eq 1

      - name: Smoke-test clean fixture (must exit 0)
        run: docker run --rm -v "$PWD:/src" loophole scan /src/tests/fixtures/py_clean.py

      - name: Smoke-test vulnerable fixture directory (must exit 1)
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/src" loophole scan /src/tests/fixtures
          test $? -eq 1
